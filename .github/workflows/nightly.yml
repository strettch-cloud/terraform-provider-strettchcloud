# Nightly full acceptance run against the sandbox team. It establishes
# the project coverage baseline and is the release gate: the last nightly must be
# green before a release is tagged.
name: Nightly

on:
  schedule:
    # 03:23 UTC. Deliberately off the top of the hour: GitHub delays or drops
    # scheduled runs during the high-load windows at :00, with no retry.
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  acceptance:
    name: Full acceptance suite
    runs-on: ubuntu-24.04
    # Shares the acceptance-sandbox group with the PR acceptance job (see pr.yml)
    # so a nightly run and a PR run never sweep the shared sandbox at the same
    # time. Non-canceling: whichever starts first finishes; the other waits.
    concurrency:
      group: acceptance-sandbox
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - name: Sweep leftovers
        env: 
          STRETTCH_CLOUD_API_KEY: ${{ secrets.STRETTCH_CLOUD_API_KEY_SANDBOX }}
        run: mise run sweep
      - name: Full acceptance with coverage
        env:
          STRETTCH_CLOUD_API_KEY: ${{ secrets.STRETTCH_CLOUD_API_KEY_SANDBOX }}
        run: mise run test-acceptance-coverage
      - name: Upload project coverage baseline
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  snapshot:
    name: Release build (snapshot)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - name: Cross-compile all platforms
        run: mise run snapshot
