version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  exclusions:
    rules:
      # Noisy on test http.Handler signatures and scaffolding; strict in prod.
      - path: _test\.go
        text: unused-parameter
        linters:
          - revive
      - path: _test\.go
        linters:
          - unparam

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
