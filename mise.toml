[tools]
go            = "1.27.3"   # must match go.mod
golangci-lint = "2.15.0"
goreleaser    = "2.19.0"
syft          = "1.56.0"   # GoReleaser's sboms stage shells out to syft; keep it on PATH in CI
terraform     = "1.17.1"

[tasks.install-hooks]
description = "enable the local pre-commit hook (polin-guard + lint); run once per clone"
run = "git config core.hooksPath .githooks"

[tasks.lint]
description = "golangci-lint (gofmt, vet, staticcheck and friends; config in .golangci.yml)"
run = "golangci-lint run ./..."

[tasks.tidy-check]
description = "go.mod / go.sum must be tidy"
run = "go mod tidy && git diff --exit-code go.mod go.sum"

[tasks.fmt-examples]
description = "example and testdata .tf files must be formatted (examples end up in the Registry docs)"
run = "terraform fmt -check -recursive examples/ internal/service/"

[tasks.license-check]
description = "every dependency has an allowed license"
run = "go run github.com/google/go-licenses@v1.6.0 check ./..."

[tasks.test]
description = "unit + client tests. Free, seconds, no key"
run = "go test ./..."

[tasks.test-coverage]
description = "same as test, with a coverage report"
run = [
  "go test ./... -coverprofile=coverage.out -coverpkg=./...",
  "go tool cover -html=coverage.out -o coverage.html",
  "go tool cover -func=coverage.out | tail -1",
]

[tasks.test-acceptance]
description = "full acceptance suite. Real API (sandbox team), creates computes"
run = "TF_ACC=1 go test ./... -v -parallel 1 -timeout 60m"

[tasks.test-acceptance-coverage]
description = "full suite incl. acceptance, with coverage (unit + client + acceptance in one report)"
run = [
  "TF_ACC=1 go test ./... -v -parallel 1 -timeout 60m -coverprofile=coverage.out -coverpkg=./...",
  "go tool cover -html=coverage.out -o coverage.html",
  "go tool cover -func=coverage.out | tail -1",
]

[tasks.test-acceptance-changed]
description = "acceptance tests only for the packages the branch changed; PKGS is set by CI (defaults to ./...)"
run = 'TF_ACC=1 go test ${PKGS:-./...} -v -parallel 1 -timeout 60m -run "^TestAcc" -coverprofile=coverage-acc.out -coverpkg=./...'

[tasks.sweep]
description = "delete leftovers tagged tf-acc-test; compute is the only package with a sweeper (TestMain in sweep_test.go)"
run = "go test ./internal/service/compute/ -sweep=all -timeout 10m"

[tasks.docs]
description = "regenerate docs/ from schema descriptions, examples/ and templates/"
run = "go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.23.0 generate"

[tasks.docs-check]
description = "fail if docs/ is not what `mise run docs` would produce (used by CI)"
run = [
  "go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.23.0 validate",
  "mise run docs",
  "git diff --exit-code docs/",
]

[tasks.snapshot]
description = "cross-compile every supported OS/arch exactly as a release would, without publishing"
run = "goreleaser build --snapshot --clean"
